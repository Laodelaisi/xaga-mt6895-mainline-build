name: Build
on:
  workflow_dispatch:
    inputs:
      TASK:
        description: "构建任务类型【调试内核请选：仅编译内核，节省CI时间】"
        required: true
        default: "仅编译内核"
        type: choice
        options:
          - "仅编译内核"
          - "仅构建RootFS"
          - "全部(内核+RootFS)"
      ROOTFS_TYPE:
        description: "RootFS发行版(仅RootFS任务生效)"
        required: true
        default: "postmarketOS"
        type: choice
        options:
          - "postmarketOS"
          - "Arch Linux ARM"
          - "Ubuntu"
      PMOS_UI:
        description: "postmarketOS桌面环境(仅pmos生效)"
        required: false
        default: "phosh"
        type: choice
        options:
          - "phosh"
          - "none"
          - "plasma-mobile"
      CLANG_VERSION:
        description: "LLVM Clang编译版本"
        required: true
        default: "18"
        type: string
      UBUNTU_VERSION:
        description: "Ubuntu版本(仅Ubuntu RootFS生效)"
        required: true
        default: "26.04 LTS"
        type: choice
        options:
          - "26.04 LTS"
          - "25.10"
          - "24.04 LTS"
      ENABLE_NOTIFY:
        description: "开启钉钉/Server酱构建通知"
        required: false
        default: true
        type: boolean

env:
  KERNEL_REPO: "MT6895-Mainline/linux"
  KERNEL_BRANCH: "7.2-mt6895-xiaomi-xaga"
  INITRAMFS_REPO: "MT6895-Mainline/initramfs"
  PHYSICAL_ROOT_PART: "/dev/mmcblk0p86"
  LOOP_IMG_PATH: "/pmos/rootfs.img"

jobs:
  # ============================================================
  # Job 1: 编译 MT6895 主线 7.2 内核 (Clang + LLVM 全链路)
  # ============================================================
  kernel:
    name: 编译主线内核
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.event.inputs.TASK != '仅构建RootFS' }}
    steps:
      - name: Checkout 本仓库(获取bot.py等工具)
        uses: actions/checkout@v5

      - name: 安装系统依赖 & LLVM 工具链 + ccache + 创建llvm无版本软链接
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends \
            build-essential bison flex libelf-dev libssl-dev cpio lz4 wget git ccache \
            device-tree-compiler f2fs-tools util-linux
          # 添加 LLVM 官方源
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-${{ inputs.CLANG_VERSION }} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt update
          sudo apt install -y clang-${{ inputs.CLANG_VERSION }} llvm-${{ inputs.CLANG_VERSION }} lld-${{ inputs.CLANG_VERSION }}

          # 创建不带版本后缀符号链接，修复 LLVM=1 模式下各类工具 not found
          CLANG_VER=${{ inputs.CLANG_VERSION }}
          sudo ln -sf /usr/bin/clang-${CLANG_VER} /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-${CLANG_VER} /usr/bin/clang++
          sudo ln -sf /usr/bin/lld-${CLANG_VER} /usr/bin/lld
          sudo ln -sf /usr/bin/ld.lld-${CLANG_VER} /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-${CLANG_VER} /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-${CLANG_VER} /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-${CLANG_VER} /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-readelf-${CLANG_VER} /usr/bin/llvm-readelf
          sudo ln -sf /usr/bin/llvm-strip-${CLANG_VER} /usr/bin/llvm-strip

          # 全部工具校验
          llvm-ar --version
          llvm-nm --version
          llvm-objcopy --version
          llvm-readelf --version
          llvm-strip --version
          ccache -M ${CCACHE_MAXSIZE}
          ccache -z

      - name: 安装 osm0sis mkbootimg (C源码, 需make编译, 去掉‑Werror兼容新GCC)
        run: |
          git clone --depth=1 https://github.com/osm0sis/mkbootimg.git
          cd mkbootimg
          sed -i 's/-Werror//g' Makefile libmincrypt/Makefile
          make
          sudo cp mkbootimg /usr/local/bin/
          sudo chmod +x /usr/local/bin/mkbootimg
          mkbootimg 2>&1 | head -3

      # ============ 调试阶段建议注释cache，节约存储配额 ============
      # - name: 内核编译缓存
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       kernel/.config
      #       kernel/arch/arm64/boot
      #       kernel/**/*.o
      #       kernel/**/*.a
      #     key: kernel-clang-${{ env.KERNEL_BRANCH }}-${{ github.sha }}
      #     restore-keys: |
      #       kernel-clang-${{ env.KERNEL_BRANCH }}-

      - name: 拉取主线内核源码
        run: |
          if [ ! -d "kernel" ]; then
            git clone -b ${{ env.KERNEL_BRANCH }} https://github.com/${{ env.KERNEL_REPO }}.git kernel
          fi

      - name: 拉取项目专用 initramfs
        run: |
          git clone https://github.com/${{ env.INITRAMFS_REPO }}.git initramfs

      - name: 加载平台 defconfig + 开启 Loop/F2FS
        working-directory: kernel
        run: |
          cp arch/arm64/configs/xaga.config arch/arm64/configs/xaga_defconfig
          # defconfig仅传ARCH，禁止传入CC/LD，防止Kconfig链接器校验报错
          make ARCH=arm64 xaga_defconfig
          ./scripts/config --set-val CONFIG_BLK_DEV_LOOP y
          ./scripts/config --set-val CONFIG_F2FS_FS y
          ./scripts/config --set-val CONFIG_F2FS_STAT_FS y

      - name: 全 LLVM 编译内核 (作者强制规范)
        working-directory: kernel
        run: |
          make -j$(nproc) ARCH=arm64 \
            CC=clang-${{ inputs.CLANG_VERSION }} \
            LD=ld.lld-${{ inputs.CLANG_VERSION }} \
            LLVM=1 LLVM_IAS=1
          # Image + DTB 拼接，绕过原厂LK dtbo限制
          cat arch/arm64/boot/Image arch/arm64/boot/dts/mediatek/mt6895-xaga.dtb > Image_with_dtb
          hexdump -C Image_with_dtb | grep d00dfeed

      - name: 编译 initramfs (物理分区版)
        working-directory: initramfs
        run: |
          make clean
          make BOOT_PARTITION=${{ env.PHYSICAL_ROOT_PART }}
          cp initramfs.cpio.lz4 ../initramfs-physical.cpio.lz4

      - name: 打包 boot‑physical.img，cmdline加入mem=6G适配6+128版本
        run: |
          mkbootimg \
            --kernel kernel/Image_with_dtb \
            --ramdisk initramfs‑physical.cpio.lz4 \
            --cmdline "earlycon=0x11200000,115200 root=${{ env.PHYSICAL_ROOT_PART }} rootfstype=ext4 loglevel=7 PMOS_NOSPLASH mem=6G" \
            -o boot‑physical.img

      - name: 上传内核编译产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            boot‑physical.img
            kernel/Image_with_dtb
            initramfs‑physical.cpio.lz4

  # ============================================================
  # Job 2: 构建 RootFS (postmarketOS / Arch Linux ARM / Ubuntu)
  # ============================================================
  rootfs:
    name: 构建RootFS
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: ${{ github.event.inputs.TASK != '仅编译内核' }}
    steps:
      - name: 安装依赖
        run: |
          sudo apt update -y
          sudo apt install -y --no-install-recommends wget git e2fsprogs util-linux

      # ============ 调试阶段注释cache，节约存储 ============
      # - name: RootFS 缓存
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       *.img
      #       *.tar.gz
      #       ~/.local/var/pmbootstrap/cache_apk
      #     key: rootfs‑${{ inputs.ROOTFS_TYPE }}‑${{ inputs.PMOS_UI }}‑${{ github.run_id }}
      #     restore‑keys: |
      #       rootfs‑${{ inputs.ROOTFS_TYPE }}‑${{ inputs.PMOS_UI }}‑

      - name: 构建 postmarketOS rootfs (pmbootstrap)
        if: ${{ inputs.ROOTFS_TYPE == 'postmarketOS' }}
        run: |
          sudo apt install -y --no-install-recommends qemu-user-static binfmt-support python3-pip
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          pip3 install --break-system-packages ./pmbootstrap
          PMOS_UI="${{ inputs.PMOS_UI }}"
          printf '\ngeneric\ngeneric‑aarch64\nmainline\n%s\nedge\n\n\n\n\n\n\n\n\n\n' "${PMOS_UI}" | pmbootstrap init
          pmbootstrap install --no‑kernel --filesystem ext4
          PMOS_IMG=$(ls -t ~/.local/var/pmbootstrap/chroot_native/home/pmos/rootfs/generic‑aarch64*.img 2>/dev/null | head -1)
          if [ -z "$PMOS_IMG" ]; then echo "错误: 未找到pmOS镜像"; exit 1; fi
          sudo losetup -P -f "$PMOS_IMG"
          LOOP_DEV=$(sudo losetup -j "$PMOS_IMG" | cut -d: -f1)
          if [ -e "${LOOP_DEV}p2" ]; then
            sudo dd if=${LOOP_DEV}p2 of=rootfs.img bs=4M status=progress
          elif [ -e "${LOOP_DEV}p1" ]; then
            sudo dd if=${LOOP_DEV}p1 of=rootfs.img bs=4M status=progress
          else
            sudo dd if=${LOOP_DEV} of=rootfs.img bs=4M status=progress
          fi
          sudo losetup -d $LOOP_DEV

      - name: 构建 Arch Linux ARM rootfs
        if: ${{ inputs.ROOTFS_TYPE == 'Arch Linux ARM' }}
        run: |
          URL="http://os.archlinuxarm.org/os/ArchLinuxARM‑aarch64‑latest.tar.gz"
          wget -q --show‑progress -O ArchLinuxARM‑aarch64.tar.gz "$URL"
          dd if=/dev/zero of=rootfs.img bs=1M count=4096 status=progress
          mkfs.ext4 -F rootfs.img
          mkdir -p rootfs_mnt
          sudo mount -o loop rootfs.img rootfs_mnt
          sudo tar -xzf ArchLinuxARM‑aarch64.tar.gz -C rootfs_mnt
          sudo umount rootfs_mnt
          rmdir rootfs_mnt

      - name: 构建 Ubuntu rootfs (动态版本探测)
        if: ${{ inputs.ROOTFS_TYPE == 'Ubuntu' }}
        run: |
          UBUNTU_VER="${{ inputs.UBUNTU_VERSION }}"
          VER_NUM=$(echo "$UBUNTU_VER" | sed 's/ LTS//')
          BASE_URL="https://cdimage.ubuntu.com/ubuntu‑base/releases/${VER_NUM}/release"
          FILENAME=$(curl -s "$BASE_URL/" | grep -oE "ubuntu‑base‑${VER_NUM}[^\"']*base‑arm64\.tar\.gz" | sort -V | tail -1)
          if [ -z "$FILENAME" ]; then echo "错误:找不到Ubuntu镜像"; exit 1; fi
          URL="${BASE_URL}/${FILENAME}"
          wget -q --show‑progress -O ubuntu‑base‑arm64.tar.gz "$URL"
          dd if=/dev/zero of=rootfs.img bs=1M count=4096 status=progress
          mkfs.ext4 -F rootfs.img
          mkdir -p rootfs_mnt
          sudo mount -o loop rootfs.img rootfs_mnt
          sudo tar -xzf ubuntu‑base‑arm64.tar.gz -C rootfs_mnt
          sudo umount rootfs_mnt
          rmdir rootfs_mnt

      - name: 上传 RootFS 产物
        uses: actions/upload-artifact@v4
        with:
          name: rootfs‑output
          path: |
            rootfs.img

  # ============================================================
  # Job 3: 编译完成通知 (钉钉 / Server酱)
  # ============================================================
  notify:
    name: 发送构建通知
    runs-on: ubuntu‑latest
    needs: [kernel, rootfs]
    if: ${{ always() && inputs.ENABLE_NOTIFY }}
    steps:
      - name: Checkout 本仓库
        uses: actions/checkout@v5

      - name: 判定整体构建状态
        id: status
        run: |
          KERNEL_RESULT="${{ needs.kernel.result }}"
          ROOTFS_RESULT="${{ needs.rootfs.result }}"
          overall="success"
          if [[ "$KERNEL_RESULT" == "failure" ]]; then
            overall="failure"
          fi
          # rootfs为skipped代表任务没有执行，不计入失败
          if [[ "$ROOTFS_RESULT" != "skipped" && "$ROOTFS_RESULT" == "failure" ]]; then
            overall="failure"
          fi
          echo "result=${overall}" >> $GITHUB_OUTPUT

      - name: 调用 bot.py 发送通知
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          pip3 install --quiet requests 2>/dev/null || true
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python3 bot.py --notify \
            --status ${{ steps.status.outputs.result }} \
            --artifact-url "$RUN_URL"
