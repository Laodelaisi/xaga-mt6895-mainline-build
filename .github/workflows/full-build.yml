name: Xaga Mainline + postmarketOS Full Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      pmos_ui:
        description: "postmarketOS 界面"
        required: true
        default: "phosh"
        type: choice
        options: [ phosh, none, plasma-mobile ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLANG_VER: "18"
      KERNEL_BRANCH: "7.2-mt6895-xiaomi-xaga"
      PHYSICAL_ROOT_PART: "/dev/mmcblk0p86"
      LOOP_IMG_PATH: "/pmos/rootfs.img"

    steps:
      # ========== 1. 拉取源码（升级v5消除Node警告） ==========
      - name: Checkout 主线内核源码
        uses: actions/checkout@v5
        with:
          repository: MT6895-Mainline/linux
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 0
          path: kernel

      - name: Checkout 项目专用 initramfs
        uses: actions/checkout@v5
        with:
          repository: MT6895-Mainline/initramfs
          path: initramfs

      # ========== 2. 安装依赖（修复clang-18 + 包名错误） ==========
      - name: 添加 LLVM 官方源并安装完整工具链
        run: |
          # 添加LLVM 18官方APT仓库（适配Ubuntu 22.04 jammy）
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-${{ env.CLANG_VER }} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          
          sudo apt update
          sudo apt install -y --no-install-recommends \
            build-essential bison flex libelf-dev libssl-dev cpio lz4 wget \
            clang-${{ env.CLANG_VER }} llvm-${{ env.CLANG_VER }} lld-${{ env.CLANG_VER }} \
            device-tree-compiler python3-pip e2fsprogs f2fs-tools util-linux
          
          sudo pip3 install --break-system-packages mkbootimg

      # ========== 3. 缓存优化 ==========
      - name: 内核编译缓存
        uses: actions/cache@v4
        with:
          path: |
            kernel/.config
            kernel/arch/arm64/boot
            kernel/**/*.o
            kernel/**/*.a
          key: kernel-clang-${{ env.KERNEL_BRANCH }}-${{ github.sha }}
          restore-keys: |
            kernel-clang-${{ env.KERNEL_BRANCH }}-

      - name: postmarketOS 镜像缓存
        uses: actions/cache@v4
        with:
          path: pmos-generic-aarch64.img
          key: pmos-edge-generic-aarch64-${{ inputs.pmos_ui }}-${{ github.run_id }}
          restore-keys: |
            pmos-edge-generic-aarch64-${{ inputs.pmos_ui }}-

      # ========== 4. 内核配置处理 ==========
      - name: 准备 xaga 平台 defconfig
        working-directory: kernel
        run: |
          cp arch/arm64/configs/xaga.config arch/arm64/configs/xaga_defconfig

      - name: 加载平台配置 + 开启 Loop/F2FS 支持
        working-directory: kernel
        run: |
          make ARCH=arm64 CC=clang-${{ env.CLANG_VER }} LD=ld.lld-${{ env.CLANG_VER }} xaga_defconfig
          ./scripts/config --set-val CONFIG_BLK_DEV_LOOP y
          ./scripts/config --set-val CONFIG_F2FS_FS y
          ./scripts/config --set-val CONFIG_F2FS_STAT_FS y

      # ========== 5. Clang 全链路编译内核 ==========
      - name: 全 LLVM 编译内核
        working-directory: kernel
        run: |
          make -j$(nproc) ARCH=arm64 CC=clang-${{ env.CLANG_VER }} LD=ld.lld-${{ env.CLANG_VER }} \
            LLVM=1 LLVM_IAS=1

      - name: 拼接 Image + DTB（绕过dtbo限制）
        working-directory: kernel
        run: |
          cat arch/arm64/boot/Image arch/arm64/boot/dts/mediatek/mt6895-xaga.dtb > Image_with_dtb
          hexdump -C Image_with_dtb | grep d00dfeed

      # ========== 6. 编译两种模式 initramfs ==========
      - name: 编译【物理分区版】initramfs
        working-directory: initramfs
        run: |
          make clean
          make BOOT_PARTITION="${{ env.PHYSICAL_ROOT_PART }}"
          cp initramfs.cpio.lz4 ../initramfs-physical.cpio.lz4

      - name: 编译【Loop 双系统版】initramfs
        working-directory: initramfs
        run: |
          make clean
          make BOOT_PARTITION="${{ env.PHYSICAL_ROOT_PART }}" LOOP_IMG="${{ env.LOOP_IMG_PATH }}"
          cp initramfs.cpio.lz4 ../initramfs-loop.cpio.lz4
        continue-on-error: true  # 官方initramfs暂不支持LOOP参数时自动跳过，不中断主构建

      # ========== 7. 处理 postmarketOS rootfs ==========
      - name: 下载 postmarketOS generic-aarch64 镜像
        run: |
          if [ ! -f pmos-generic-aarch64.img ]; then
            wget -O pmos-generic-aarch64.img \
              https://images.postmarketos.org/bpo/edge/generic-aarch64/${{ inputs.pmos_ui }}/postmarketos-${{ inputs.pmos_ui }}-generic-aarch64.img
          fi

      - name: 提取纯 rootfs 分区镜像
        run: |
          sudo losetup -P -f pmos-generic-aarch64.img
          LOOP_DEV=$(sudo losetup -j pmos-generic-aarch64.img | cut -d: -f1)
          sudo dd if=${LOOP_DEV}p2 of=pmos-rootfs.ext4 bs=4M status=progress
          sudo losetup -d $LOOP_DEV
          cp pmos-rootfs.ext4 rootfs.img

      # ========== 8. 打包两种 boot.img ==========
      - name: 打包【物理分区版】boot.img
        run: |
          mkbootimg \
            --kernel kernel/Image_with_dtb \
            --ramdisk initramfs-physical.cpio.lz4 \
            --cmdline "earlycon=0x1120000,115200 root=${{ env.PHYSICAL_ROOT_PART }} rootfstype=ext4 loglevel=7 PMOS_NOSPLASH" \
            -o boot-physical.img

      - name: 打包【Loop 双系统版】boot.img
        if: success()
        run: |
          mkbootimg \
            --kernel kernel/Image_with_dtb \
            --ramdisk initramfs-loop.cpio.lz4 \
            --cmdline "earlycon=0x1120000,115200 rootfstype=ext4 loglevel=7 PMOS_NOSPLASH loop_img=${{ env.LOOP_IMG_PATH }}" \
            -o boot-loop.img
        continue-on-error: true

      # ========== 9. 上传全部产物 ==========
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: xaga-mainline-pmos-full
          path: |
            kernel/Image_with_dtb
            boot-physical.img
            boot-loop.img
            initramfs-physical.cpio.lz4
            initramfs-loop.cpio.lz4
            pmos-rootfs.ext4
            rootfs.img
